<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ankita's Board Protocol</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS for Animations and Scrollbar hiding -->
    <style>
        body { margin: 0; padding: 0; background-color: black; }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .scrollbar-hide {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Custom Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn95 { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .animate-in { animation-duration: 300ms; animation-fill-mode: both; }
        .fade-in { animation-name: fadeIn; }
        .zoom-in-95 { animation-name: zoomIn95; }
        .duration-200 { animation-duration: 200ms; }
        .duration-300 { animation-duration: 300ms; }
        .duration-500 { animation-duration: 500ms; }
        .duration-700 { animation-duration: 700ms; }
    </style>

    <!-- Import Map for React and Lucide Icons -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.294.0"
        }
    }
    </script>

    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- Main React Application -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from "react";
        import { createRoot } from "react-dom/client";
        import { 
          Play, Pause, RotateCcw, Check, Brain, Coffee, Moon, Sun, 
          BookOpen, Zap, Layout, Heart, Menu, X, Trash2 
        } from "lucide-react";

        // --- Components ---
        const Card = ({ children, className = "" }) => (
          <div className={`bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl ${className}`}>
            {children}
          </div>
        );

        const Badge = ({ children, active }) => (
          <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase ${active ? 'bg-white text-black' : 'bg-zinc-800 text-zinc-500'}`}>
            {children}
          </span>
        );

        const Button = ({ onClick, children, variant = "primary", className = "", disabled = false, title }) => {
          const baseStyle = "inline-flex items-center justify-center rounded-xl font-medium transition-all active:scale-95 disabled:opacity-50 disabled:pointer-events-none";
          const variants = {
            primary: "bg-white text-black hover:bg-zinc-200 shadow-[0_0_20px_rgba(255,255,255,0.1)]",
            outline: "border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-600 bg-transparent",
            ghost: "text-zinc-500 hover:text-zinc-300 bg-transparent",
          };
          return (
            <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`} title={title}>
              {children}
            </button>
          );
        };

        const ProgressBar = ({ current, total }) => {
          const percent = Math.min((current / total) * 100, 100);
          return (
            <div className="h-1.5 w-full bg-zinc-800 rounded-full overflow-hidden">
              <div 
                className="h-full bg-gradient-to-r from-emerald-500 to-emerald-300 transition-all duration-500 ease-out"
                style={{ width: `${percent}%` }}
              />
            </div>
          );
        };

        // --- Main Application ---
        function AnkitaBoardProtocol() {
          // --- Configuration ---
          const FOCUS_TIME = 50 * 60; 
          const BREAK_TIME = 5 * 60;  
          const LONG_BREAK_TIME = 10 * 60; 
          const TOTAL_SESSIONS = 8;
          
          // --- State ---
          const [seconds, setSeconds] = useState(FOCUS_TIME);
          const [isActive, setIsActive] = useState(false);
          const [mode, setMode] = useState('FOCUS'); 
          const [currentBlockId, setCurrentBlockId] = useState('morning');
          const [currentTime, setCurrentTime] = useState(new Date());
          
          // Advanced Logging State
          const [sessionLogs, setSessionLogs] = useState([]);
          const [isLogModalOpen, setIsLogModalOpen] = useState(false);
          const sessionsCompleted = sessionLogs.length;

          // Break logic state
          const [completedBreaks, setCompletedBreaks] = useState([]);
          const [showPopup, setShowPopup] = useState(false);

          // Refs for double-tap logic
          const lastTapRef = useRef(0);
          const tappedBlockRef = useRef(null);

          // --- Schedule Definition (12hr format + Types) ---
          const schedule = [
            { id: 'morning', label: 'Morning Block', time: '4:00 AM - 7:00 AM', icon: Sun, desc: 'Recall & Revision (3 Sessions)', type: 'timer' },
            { id: 'routine', label: 'Routine Break', time: '7:00 AM - 8:00 AM', icon: Coffee, desc: 'Shower, Breakfast, Reset', type: 'break', quote: 'I love you, u doing well' },
            { id: 'lecture', label: 'Lecture Block', time: '8:00 AM - 12:00 PM', icon: BookOpen, desc: 'Physics / Chemistry', type: 'timer' },
            { id: 'noon_break', label: 'Lunch Break', time: '12:00 PM - 1:00 PM', icon: Layout, desc: 'Phone allowed. Relax.', type: 'break', quote: 'Easy there my love, eat something now' },
            { id: 'afternoon', label: 'Afternoon Block', time: '1:00 PM - 5:00 PM', icon: Brain, desc: 'Deep Revision (4 Sessions)', type: 'timer' },
            { id: 'practice', label: 'Confidence Hour', time: '5:00 PM - 6:00 PM', icon: Zap, desc: 'Selective Qs & Mock Test', type: 'timer' },
            { id: 'evening', label: 'Evening Block', time: '6:00 PM - 10:00 PM', icon: Moon, desc: 'MCQs & Light Reinforcement', type: 'timer' },
          ];

          const currentBlockDef = schedule.find(s => s.id === currentBlockId);
          const isBreakView = currentBlockDef?.type === 'break';

          // --- Helpers ---
          const formatTime = (sec) => {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
          };

          const getGreeting = () => {
            const hour = currentTime.getHours();
            if (hour < 5) return "Early Morning War";
            if (hour < 12) return "Good Morning";
            if (hour < 17) return "Good Afternoon";
            return "Good Evening";
          };

          // --- Effects ---
          useEffect(() => {
            const timer = setInterval(() => {
              const now = new Date();
              setCurrentTime(now);
            }, 1000 * 60); 
            return () => clearInterval(timer);
          }, []);

          useEffect(() => {
            let interval = null;
            if (isActive && seconds > 0 && !isBreakView) {
              interval = setInterval(() => {
                setSeconds((s) => s - 1);
              }, 1000);
            } else if (seconds === 0 && isActive && !isBreakView) {
              handleTimerComplete();
            }
            return () => clearInterval(interval);
          }, [isActive, seconds, isBreakView]);

          // --- Handlers ---
          const handleTimerComplete = () => {
            const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
            audio.play().catch(e => console.log("Audio play failed", e));

            if (mode === 'FOCUS') {
              // Create a log entry
              const newLog = {
                id: Date.now(),
                label: currentBlockDef?.label || "Focus Session",
                time: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true })
              };
              setSessionLogs(prev => [...prev, newLog]);
              
              setMode('WALL_MODE');
              const isAfternoon = currentBlockId === 'afternoon';
              setSeconds(isAfternoon ? LONG_BREAK_TIME : BREAK_TIME);
              setIsActive(true); 
            } else {
              setMode('FOCUS');
              setSeconds(FOCUS_TIME);
              setIsActive(false);
            }
          };

          const toggleTimer = () => setIsActive(!isActive);

          const resetTimer = () => {
            setIsActive(false);
            setMode('FOCUS');
            setSeconds(FOCUS_TIME);
          };

          const deleteSession = (idToRemove) => {
            setSessionLogs(prev => prev.filter(log => log.id !== idToRemove));
          };

          // Custom Double-Tap Handler
          const handleBlockTap = (block) => {
            const now = Date.now();
            const timeDiff = now - lastTapRef.current;
            
            setCurrentBlockId(block.id);

            // If tapped twice within 350ms on the same block
            if (timeDiff < 350 && tappedBlockRef.current === block.id) {
              if (block.type === 'break' && !completedBreaks.includes(block.id)) {
                setCompletedBreaks(prev => [...prev, block.id]);
                setShowPopup(true);
                setTimeout(() => setShowPopup(false), 3000); // Hide popup after 3s
              }
            }
            
            lastTapRef.current = now;
            tappedBlockRef.current = block.id;
          };

          // --- Wall Mode (Full Screen Overlay) ---
          if (mode === 'WALL_MODE') {
            return (
              <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center text-center p-6 animate-in fade-in duration-700">
                <div className="max-w-md space-y-12">
                  <div className="space-y-4">
                    <h1 className="text-4xl md:text-6xl font-black text-zinc-100 tracking-tighter uppercase">Wall Mode</h1>
                    <p className="text-zinc-500 text-lg md:text-xl font-light tracking-widest uppercase">No Phone. No Inputs. Just Stare.</p>
                  </div>
                  <div className="relative flex items-center justify-center">
                    <div className="absolute w-64 h-64 bg-zinc-800/30 rounded-full animate-pulse blur-3xl"></div>
                    <div className="text-8xl md:text-9xl font-mono font-thin text-white tabular-nums tracking-tighter z-10">
                      {formatTime(seconds)}
                    </div>
                  </div>
                  <div className="space-y-6 flex flex-col items-center">
                    <p className="text-zinc-600 italic">"Consolidating memory..."</p>
                    <Button onClick={handleTimerComplete} variant="outline" className="px-8 py-4 rounded-full border-zinc-800 text-zinc-400 hover:text-emerald-400 hover:border-emerald-500/50 mt-4 flex items-center gap-2 group">
                      <Check className="w-5 h-5 group-hover:scale-110 transition-transform" />
                      <span>Complete Break</span>
                    </Button>
                  </div>
                </div>
              </div>
            );
          }

          // --- Standard UI ---
          return (
            <div className="min-h-screen bg-black text-zinc-100 font-sans selection:bg-zinc-800 relative overflow-hidden">
              
              {/* Session Log Modal Overlay */}
              {isLogModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm animate-in fade-in duration-200 p-4">
                  <div className="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-3xl shadow-2xl p-6 relative flex flex-col max-h-[80vh] animate-in zoom-in-95 duration-200">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6">
                      <div>
                        <h2 className="text-xl font-light text-white">Session Log</h2>
                        <p className="text-xs text-zinc-500 uppercase tracking-widest mt-1">
                          {sessionsCompleted} / {TOTAL_SESSIONS} Completed
                        </p>
                      </div>
                      <button 
                        onClick={() => setIsLogModalOpen(false)} 
                        className="p-2 rounded-full hover:bg-zinc-800 text-zinc-400 hover:text-white transition-colors"
                      >
                        <X size={20} />
                      </button>
                    </div>

                    {/* List */}
                    <div className="flex-1 overflow-y-auto space-y-3 pr-2 scrollbar-hide">
                      {sessionLogs.length === 0 ? (
                        <div className="text-center py-10 flex flex-col items-center justify-center space-y-3">
                          <div className="w-12 h-12 rounded-full bg-zinc-800/50 flex items-center justify-center text-zinc-600">
                            <Brain size={20} />
                          </div>
                          <p className="text-zinc-500 text-sm font-light">No sessions logged yet.</p>
                        </div>
                      ) : (
                        sessionLogs.map((log, index) => (
                          <div key={log.id} className="flex items-center justify-between p-4 bg-zinc-800/30 rounded-2xl border border-zinc-800/50">
                            <div className="flex items-center gap-3">
                              <div className="w-6 h-6 rounded-full bg-emerald-500/10 flex items-center justify-center">
                                <span className="text-xs font-mono text-emerald-400">{index + 1}</span>
                              </div>
                              <div>
                                <p className="text-sm text-zinc-200 font-medium">{log.label}</p>
                                <p className="text-xs text-zinc-500 font-mono mt-0.5">{log.time}</p>
                              </div>
                            </div>
                            <button 
                              onClick={() => deleteSession(log.id)}
                              className="p-2 text-zinc-600 hover:text-red-400 hover:bg-red-500/10 rounded-xl transition-colors"
                              title="Delete Session"
                            >
                              <Trash2 size={16} />
                            </button>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* Pop-up Overlay ("I'm proud of you") */}
              {showPopup && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm animate-in fade-in duration-300">
                  <div className="bg-zinc-900 border border-emerald-500/30 p-8 rounded-3xl shadow-2xl flex flex-col items-center space-y-4 animate-in zoom-in-95 duration-300">
                    <div className="w-16 h-16 bg-emerald-500/10 rounded-full flex items-center justify-center">
                      <Heart className="w-8 h-8 text-emerald-400 fill-emerald-400 animate-pulse" />
                    </div>
                    <h2 className="text-2xl font-light tracking-wide text-white">I'm proud of you</h2>
                  </div>
                </div>
              )}

              <div className="max-w-md mx-auto min-h-screen flex flex-col p-4 md:p-6">
                
                {/* Header */}
                <header className="flex justify-between items-center mb-8 pt-2">
                  <div>
                    <h2 className="text-zinc-500 text-xs font-bold tracking-[0.2em] uppercase mb-1">Ankita's Protocol</h2>
                    <h1 className="text-xl font-light">{getGreeting()}</h1>
                  </div>
                  <div className="text-right">
                    <div className="text-2xl font-bold font-mono text-emerald-400">
                      {currentTime.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true })}
                    </div>
                    <div className="text-zinc-500 text-xs font-medium tracking-wide">
                      {currentTime.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}
                    </div>
                  </div>
                </header>

                {/* Dynamic Display Card */}
                <Card className="p-8 mb-6 relative overflow-hidden min-h-[280px] flex flex-col justify-center">
                  
                  {/* Hamburger Menu for Session Logs */}
                  <button 
                    onClick={() => setIsLogModalOpen(true)}
                    className="absolute top-4 right-4 z-20 p-2 text-zinc-500 hover:text-emerald-400 transition-colors"
                    title="View Session Log"
                  >
                    <Menu size={24} strokeWidth={2.5} />
                  </button>

                  {isBreakView ? (
                    // Break Message View
                    <div className="relative z-10 flex flex-col items-center text-center space-y-6 animate-in fade-in zoom-in-95 duration-500">
                      <Heart className="w-10 h-10 text-pink-500/40 animate-pulse" />
                      <p className="text-2xl font-light italic text-zinc-200 leading-relaxed px-4">
                        "{currentBlockDef.quote}"
                      </p>
                      <p className="text-[10px] text-zinc-500 uppercase tracking-widest pt-4">
                        Double tap this block below to complete
                      </p>
                    </div>
                  ) : (
                    // Timer View
                    <>
                      <div className={`absolute top-0 left-1/2 -translate-x-1/2 w-40 h-40 bg-${isActive ? 'emerald' : 'zinc'}-500/10 rounded-full blur-[60px] transition-colors duration-1000`}></div>
                      <div className="relative z-10 flex flex-col items-center text-center space-y-6 animate-in fade-in duration-300">
                        <div className="space-y-2">
                          <Badge active={isActive}>{mode === 'FOCUS' ? 'Deep Focus Session' : 'Restoring'}</Badge>
                          <h3 className="text-zinc-400 text-sm tracking-widest uppercase mt-2">
                            {currentBlockDef?.label || "Free Time"}
                          </h3>
                        </div>

                        <div className={`text-7xl font-light tracking-tighter tabular-nums transition-colors duration-300 ${isActive ? 'text-white' : 'text-zinc-400'}`}>
                          {formatTime(seconds)}
                        </div>

                        <div className="flex gap-4 w-full justify-center items-center mt-2">
                          <Button onClick={handleTimerComplete} variant="outline" className="h-14 w-14 rounded-2xl !p-0 border-zinc-800 text-emerald-500 hover:bg-emerald-500/10 hover:border-emerald-500/50" title="Complete Session Now">
                            <Check className="w-6 h-6" />
                          </Button>
                          <Button onClick={toggleTimer} className="h-16 w-16 rounded-3xl !p-0 bg-white text-black hover:bg-zinc-200">
                            {isActive ? <Pause className="w-7 h-7" /> : <Play className="w-7 h-7 ml-1" />}
                          </Button>
                          <Button onClick={resetTimer} variant="outline" className="h-14 w-14 rounded-2xl !p-0 border-zinc-800 text-zinc-500 hover:text-zinc-300" title="Reset Timer">
                            <RotateCcw className="w-5 h-5" />
                          </Button>
                        </div>
                      </div>
                    </>
                  )}
                </Card>

                {/* Daily Progress */}
                <div className="mb-8 space-y-3">
                  <div className="flex justify-between items-end px-1">
                    <span className="text-zinc-500 text-xs uppercase tracking-wider font-semibold">Daily Velocity</span>
                    <span className="text-emerald-400 text-sm font-mono">{sessionsCompleted} <span className="text-zinc-600">/ {TOTAL_SESSIONS} Sessions</span></span>
                  </div>
                  <ProgressBar current={sessionsCompleted} total={TOTAL_SESSIONS} />
                </div>

                {/* Schedule Timeline */}
                <div className="flex-1 overflow-y-auto space-y-3 pr-1 pb-10 scrollbar-hide">
                  <h3 className="text-zinc-500 text-xs font-bold tracking-[0.2em] uppercase mb-4 px-1">System Timeline</h3>
                  
                  {schedule.map((block) => {
                    const isCurrent = currentBlockId === block.id;
                    const isBreakCompleted = completedBreaks.includes(block.id);
                    const Icon = block.icon;
                    
                    let containerStyles = "bg-transparent border-transparent hover:bg-zinc-900/50";
                    let iconStyles = "bg-zinc-900 text-zinc-600";
                    let titleStyles = "text-zinc-400";

                    if (isCurrent) {
                      containerStyles = "bg-zinc-900 border-zinc-700 shadow-lg scale-[1.02]";
                      iconStyles = block.type === 'break' ? "bg-pink-500 text-white" : "bg-emerald-500 text-black";
                      titleStyles = block.type === 'break' ? "text-pink-400" : "text-emerald-400";
                    }
                    if (isBreakCompleted) {
                      containerStyles = "bg-emerald-900/20 border-emerald-500/30";
                      iconStyles = "bg-emerald-500 text-black";
                      titleStyles = "text-emerald-400";
                    }
                    
                    return (
                      <div 
                        key={block.id}
                        onClick={() => handleBlockTap(block)}
                        className={`group flex items-start gap-4 p-4 rounded-xl border transition-all duration-300 cursor-pointer select-none ${containerStyles}`}
                      >
                        <div className={`mt-1 p-2 rounded-lg transition-colors ${iconStyles}`}>
                          {isBreakCompleted ? <Check size={18} /> : <Icon size={18} />}
                        </div>
                        
                        <div className="flex-1 min-w-0 pointer-events-none">
                          <div className="flex justify-between items-center mb-1">
                            <h4 className={`text-sm font-medium transition-colors ${titleStyles}`}>
                              {block.label}
                            </h4>
                            <span className="text-[10px] font-mono text-zinc-500 bg-zinc-900/80 px-2 py-1 rounded">
                              {block.time}
                            </span>
                          </div>
                          <p className="text-xs text-zinc-500 leading-relaxed line-clamp-2">
                            {isBreakCompleted ? "Rest Complete." : block.desc}
                          </p>
                        </div>
                        
                        {isCurrent && !isBreakCompleted && (
                          <div className="self-center">
                            <div className={`w-2 h-2 rounded-full animate-pulse shadow-[0_0_10px_currentColor] ${block.type === 'break' ? 'bg-pink-500 text-pink-500' : 'bg-emerald-500 text-emerald-500'}`}></div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                {/* Footer */}
                <div className="text-center py-4 border-t border-zinc-900">
                   <p className="text-[10px] text-zinc-600 uppercase tracking-widest">Built with discipline. Powered by love.</p>
                </div>

              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AnkitaBoardProtocol />);
    </script>
</body>
</html>
